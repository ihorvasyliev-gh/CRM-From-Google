<!doctype html>
<!--
  Served by Cloudflare Pages with status 404 (and Cache-Control: no-store) for any missing
  /assets/ file. Without it, Pages falls back to the SPA's index.html with status 200, which
  _headers marks immutable for a year — a browser that asked for a new file while a deploy was
  switching over would keep that HTML as the "script" and the app would never start.
-->
<html lang="en"><head><meta charset="UTF-8"><title>Not found</title></head><body>Not found</body></html>
