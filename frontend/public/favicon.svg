<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Same mark as the sidebar logo: brand gradient tile with a "C" -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0766ee"/>
      <stop offset="0.5" stop-color="#004fd6"/>
      <stop offset="1" stop-color="#8e51ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <text x="32" y="44" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff">C</text>
</svg>
