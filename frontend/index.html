<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Course CRM — student enrollment management system" />
  <meta name="theme-color" content="#09090b" />
  <style>
    /* Critical Inline CSS for instant 0ms FCP */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #09090b;
      color: #fafafa;
      font-family: 'Inter Variable', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    html[data-boot-theme="light"], html[data-boot-theme="light"] body,
    html[data-boot-theme="light"] #boot-splash { background-color: #f3f5f8 !important; color: #18181b !important; }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .boot-spinner { animation-duration: 2s !important; }
    }
  </style>
  <title>Course CRM</title>
  <script>
    // Apply saved theme & density before first paint (prevents a dark flash for light-theme users)
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        if (!dark) {
          root.setAttribute('data-boot-theme', 'light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#f3f5f8');
        }
        if (localStorage.getItem('view_density') === 'compact') root.classList.add('density-compact');
      } catch (e) { /* storage unavailable */ }
    })();
  </script>
</head>

<body>
  <div id="root">
    <div id="boot-splash" style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #09090b; color: #fafafa; padding: 16px;">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #ffffff; font-size: 16px; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);">C</div>
        <div>
          <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em;">Course CRM</div>
          <div style="font-size: 10px; color: #71717a; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Loading Portal...</div>
        </div>
      </div>
      <div class="boot-spinner" style="width: 28px; height: 28px; border: 2px solid rgba(99, 102, 241, 0.2); border-top-color: #6366f1; border-radius: 50%; animation: crm-spin 0.8s linear infinite;"></div>
    </div>
    <style>
      @keyframes crm-spin { to { transform: rotate(360deg); } }
    </style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
